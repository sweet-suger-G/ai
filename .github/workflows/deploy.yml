name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Build React app ──────────────────────────────────────
  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build
        working-directory: app
        run: npm run build

      - name: Upload React build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: app/dist

  # ── Job 2: Deploy combined site ─────────────────────────────────
  deploy:
    needs: build-react
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: _site/app

      - name: Copy static version to site root
        run: |
          cp static/index.html _site/index.html

      - name: Create navigation page
        run: |
          cat > _site/versions.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8"/>
            <title>珠宝塔罗 · 版本选择</title>
            <style>
              body{background:#06020F;color:#EAD8A0;font-family:'Georgia',serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
              .wrap{text-align:center;}
              h1{color:#F0D080;font-size:2rem;margin-bottom:32px;}
              .links{display:flex;gap:24px;justify-content:center;}
              a{display:block;padding:18px 32px;border:1px solid rgba(201,168,76,0.5);border-radius:12px;color:#C9A84C;text-decoration:none;transition:all 0.3s;}
              a:hover{border-color:#F0D080;background:rgba(201,168,76,0.1);}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>💎 珠宝塔罗</h1>
              <div class="links">
                <a href="index.html">📄 静态版本<br/><small>单文件·即开即用</small></a>
                <a href="app/index.html">⚛️ React版本<br/><small>完整应用·功能丰富</small></a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
