<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>珠宝塔罗 · Jewelry Tarot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── Variables ────────────────────────────────────────────── */
    :root {
      --gold:        #C9A84C;
      --gold-light:  #F0D080;
      --gold-dark:   #8B6914;
      --gold-glow:   rgba(201,168,76,0.35);
      --bg-deep:     #06020F;
      --bg-mid:      #100828;
      --bg-card:     #160A30;
      --text-main:   #EAD8A0;
      --text-sub:    #A89060;
      --border:      rgba(201,168,76,0.4);
      --radius:      12px;
      --card-w:      160px;
      --card-h:      272px;
    }

    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html { scroll-behavior:smooth; }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Starfield ─────────────────────────────────────────────── */
    #stars {
      position: fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(80,30,140,0.45) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(40,10,90,0.4) 0%, transparent 55%),
        var(--bg-deep);
    }
    #stars::before, #stars::after {
      content:'';
      position:absolute; inset:0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 40%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 90%, rgba(255,240,180,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 10%, rgba(255,255,255,0.6) 0%, transparent 100%);
    }
    #stars::after {
      transform: scale(1.1) rotate(15deg);
      opacity: 0.6;
    }

    /* ─── Layout wrapper ────────────────────────────────────────── */
    .container { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:0 16px 80px; }

    /* ─── Header ────────────────────────────────────────────────── */
    header {
      text-align:center;
      padding: 56px 0 32px;
    }
    .logo-gem {
      font-size: 3rem;
      display: block;
      animation: gemPulse 3s ease-in-out infinite;
    }
    @keyframes gemPulse {
      0%,100% { filter:drop-shadow(0 0 8px var(--gold)); }
      50%      { filter:drop-shadow(0 0 22px var(--gold-light)); }
    }
    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.5rem, 5vw, 2.8rem);
      color: var(--gold-light);
      letter-spacing: 0.08em;
      margin: 8px 0 4px;
      text-shadow: 0 0 30px var(--gold-glow);
    }
    header .subtitle {
      font-size:0.85rem;
      color:var(--text-sub);
      letter-spacing:0.2em;
      font-family:'Noto Serif SC', serif;
    }
    .divider {
      margin: 24px auto;
      width: 220px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* ─── Intro ──────────────────────────────────────────────────── */
    .intro {
      text-align:center;
      color:var(--text-sub);
      font-size:0.9rem;
      line-height:1.8;
      max-width:560px;
      margin:0 auto 40px;
      font-family:'Noto Serif SC', serif;
    }

    /* ─── Spread Selector ────────────────────────────────────────── */
    .spread-section { text-align:center; margin-bottom:36px; }
    .spread-section h2 {
      font-size:0.8rem;
      letter-spacing:0.25em;
      color:var(--text-sub);
      margin-bottom:20px;
      text-transform:uppercase;
    }
    .spread-options {
      display:flex;
      gap:16px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .spread-btn {
      background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      color: var(--text-main);
      font-family: 'Cinzel','Noto Serif SC', serif;
      transition: all 0.3s;
      min-width: 160px;
      text-align:center;
    }
    .spread-btn:hover {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.06));
      transform: translateY(-2px);
      box-shadow: 0 4px 20px var(--gold-glow);
    }
    .spread-btn.active {
      border-color: var(--gold-light);
      background: linear-gradient(135deg, rgba(201,168,76,0.25), rgba(201,168,76,0.08));
      box-shadow: 0 0 24px var(--gold-glow);
    }
    .spread-btn .icon { font-size:2rem; display:block; margin-bottom:8px; }
    .spread-btn .label { font-size:0.95rem; color:var(--gold-light); display:block; }
    .spread-btn .desc  { font-size:0.72rem; color:var(--text-sub); display:block; margin-top:4px; font-family:'Noto Serif SC',serif; }

    /* ─── Intent / Question ──────────────────────────────────────── */
    .intent-wrap { text-align:center; margin-bottom:28px; }
    .intent-wrap input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 24px;
      color: var(--text-main);
      font-family: 'Noto Serif SC', serif;
      font-size: 0.9rem;
      width: min(420px, 90%);
      text-align:center;
      outline:none;
      transition:border-color 0.3s;
    }
    .intent-wrap input:focus { border-color:var(--gold); }
    .intent-wrap input::placeholder { color:var(--text-sub); }

    /* ─── Draw Button ────────────────────────────────────────────── */
    .draw-section { text-align:center; margin-bottom:48px; }
    #drawBtn {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light), var(--gold));
      background-size: 200% 200%;
      border: none;
      border-radius: 50px;
      padding: 14px 48px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      color: var(--bg-deep);
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.3s;
      animation: shimmer 3s linear infinite;
      box-shadow: 0 4px 20px var(--gold-glow);
    }
    @keyframes shimmer {
      0%   { background-position:0% 50%; }
      50%  { background-position:100% 50%; }
      100% { background-position:0% 50%; }
    }
    #drawBtn:hover { transform:scale(1.04) translateY(-2px); box-shadow:0 6px 32px rgba(201,168,76,0.5); }
    #drawBtn:active { transform:scale(0.98); }
    #drawBtn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    #resetBtn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 28px;
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      color: var(--text-sub);
      cursor: pointer;
      margin-left: 12px;
      transition: all 0.3s;
      display:none;
    }
    #resetBtn:hover { border-color:var(--gold); color:var(--text-main); }

    /* ─── Spread Label Area ──────────────────────────────────────── */
    #spreadInfo {
      display:none;
      text-align:center;
      margin-bottom:24px;
    }
    .position-legend {
      display:flex;
      gap:24px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .pos-item {
      font-size:0.75rem;
      color:var(--text-sub);
      text-align:center;
      font-family:'Noto Serif SC',serif;
    }
    .pos-num {
      display:inline-block;
      width:22px; height:22px;
      border:1px solid var(--gold);
      border-radius:50%;
      line-height:20px;
      font-size:0.7rem;
      color:var(--gold);
      margin-bottom:4px;
    }

    /* ─── Cards Grid ─────────────────────────────────────────────── */
    #cardsArea {
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:center;
      min-height:80px;
      margin-bottom:24px;
    }

    /* ─── Celtic Cross Layout ────────────────────────────────────── */
    #cardsArea.celtic {
      display:grid;
      grid-template-areas:
        ". . b . e"
        "c ab a d e"
        ". . f . g"
        ". . . . h"
        ". . . . i"
        ". . . . j";
      grid-template-columns: repeat(5, var(--card-w));
      grid-template-rows: auto;
      gap:12px;
      justify-content:center;
    }
    #cardsArea.celtic .card-slot:nth-child(1)  { grid-area:a; }
    #cardsArea.celtic .card-slot:nth-child(2)  { grid-area:ab; transform:rotate(90deg); }
    #cardsArea.celtic .card-slot:nth-child(3)  { grid-area:b; }
    #cardsArea.celtic .card-slot:nth-child(4)  { grid-area:f; }
    #cardsArea.celtic .card-slot:nth-child(5)  { grid-area:c; }
    #cardsArea.celtic .card-slot:nth-child(6)  { grid-area:d; }
    #cardsArea.celtic .card-slot:nth-child(7)  { grid-area:e; }
    #cardsArea.celtic .card-slot:nth-child(8)  { grid-area:g; }
    #cardsArea.celtic .card-slot:nth-child(9)  { grid-area:h; }
    #cardsArea.celtic .card-slot:nth-child(10) { grid-area:i; }

    /* ─── Card Slot ──────────────────────────────────────────────── */
    .card-slot {
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      cursor:pointer;
      position:relative;
    }
    .card-slot .position-label {
      position:absolute;
      bottom:-22px;
      left:0; right:0;
      text-align:center;
      font-size:0.68rem;
      color:var(--text-sub);
      font-family:'Noto Serif SC',serif;
      pointer-events:none;
    }
    .card-inner {
      width:100%; height:100%;
      position:relative;
      transform-style:preserve-3d;
      transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);
      border-radius: var(--radius);
    }
    .card-slot.flipped .card-inner { transform:rotateY(180deg); }
    .card-slot.reversed .card-inner { transform:rotateY(180deg) rotateZ(180deg); }

    .card-face, .card-back {
      position:absolute; inset:0;
      border-radius:var(--radius);
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    /* Card Back */
    .card-back {
      background: linear-gradient(145deg, #1A0A35, #0D0520);
      border: 2px solid rgba(201,168,76,0.5);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .card-back::before {
      content:'';
      position:absolute; inset:8px;
      border:1px solid rgba(201,168,76,0.25);
      border-radius:8px;
    }
    .card-back::after {
      content:'✦';
      font-size:2.5rem;
      color:rgba(201,168,76,0.35);
      position:absolute;
    }
    .card-back-pattern {
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(45deg, rgba(201,168,76,0.04) 0px, rgba(201,168,76,0.04) 1px, transparent 1px, transparent 8px),
        repeating-linear-gradient(-45deg, rgba(201,168,76,0.04) 0px, rgba(201,168,76,0.04) 1px, transparent 1px, transparent 8px);
    }

    /* Card Face */
    .card-face {
      transform: rotateY(180deg);
      background: var(--bg-card);
      border: 2px solid rgba(201,168,76,0.6);
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    .card-face:hover { box-shadow:0 0 28px var(--gold-glow); }

    .card-img-wrap {
      flex:1;
      overflow:hidden;
      position:relative;
      display:flex; align-items:center; justify-content:center;
    }
    .card-img-wrap img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:opacity 0.4s;
    }
    /* Gem fallback shown when image fails */
    .gem-fallback {
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      width:100%; height:100%;
      font-size:3.5rem;
      background: radial-gradient(ellipse at center, var(--gem-bg,#1A0A30) 0%, #06020F 100%);
    }

    .card-info {
      padding:6px 8px;
      text-align:center;
      border-top:1px solid rgba(201,168,76,0.2);
      background: rgba(6,2,15,0.6);
    }
    .card-number { font-size:0.6rem; color:var(--gold); letter-spacing:0.15em; }
    .card-name-cn { font-size:0.82rem; color:var(--text-main); font-family:'Noto Serif SC',serif; margin:1px 0; }
    .card-gem { font-size:0.62rem; color:var(--text-sub); font-family:'Noto Serif SC',serif; }

    /* Reversed overlay */
    .reversed-badge {
      position:absolute;
      top:6px; right:6px;
      background:rgba(180,30,30,0.7);
      color:#fff;
      font-size:0.55rem;
      padding:2px 6px;
      border-radius:4px;
      letter-spacing:0.1em;
      display:none;
      font-family:'Noto Serif SC',serif;
    }
    .card-slot.reversed .reversed-badge { display:block; }

    /* Entrance animation */
    @keyframes cardAppear {
      from { opacity:0; transform:translateY(24px) scale(0.92); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .card-slot { animation:cardAppear 0.5s ease both; }

    /* ─── Reading Hint ────────────────────────────────────────────── */
    #hint {
      text-align:center;
      color:var(--text-sub);
      font-size:0.8rem;
      font-family:'Noto Serif SC',serif;
      display:none;
      margin-bottom:48px;
    }

    /* ─── Modal ──────────────────────────────────────────────────── */
    #modal {
      position:fixed; inset:0; z-index:100;
      display:flex; align-items:center; justify-content:center;
      padding:16px;
      opacity:0; pointer-events:none;
      transition:opacity 0.3s;
    }
    #modal.open { opacity:1; pointer-events:all; }
    .modal-overlay {
      position:absolute; inset:0;
      background:rgba(6,2,15,0.88);
      backdrop-filter:blur(6px);
    }
    .modal-box {
      position:relative; z-index:1;
      background: linear-gradient(145deg, #160A30, #0D0520);
      border:1px solid rgba(201,168,76,0.5);
      border-radius:16px;
      max-width:680px; width:100%;
      max-height:90vh;
      overflow-y:auto;
      padding:32px;
      transform:scale(0.9);
      transition:transform 0.3s;
      box-shadow:0 0 60px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
    }
    #modal.open .modal-box { transform:scale(1); }
    .modal-close {
      position:absolute; top:16px; right:16px;
      background:transparent; border:1px solid var(--border);
      border-radius:50%; width:32px; height:32px;
      color:var(--text-sub); font-size:1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all 0.2s;
    }
    .modal-close:hover { border-color:var(--gold); color:var(--gold); }

    .modal-inner { display:flex; gap:28px; flex-wrap:wrap; }
    .modal-card-img {
      flex-shrink:0;
      width:140px; height:238px;
      border-radius:10px;
      border:2px solid rgba(201,168,76,0.5);
      object-fit:cover;
      box-shadow:0 4px 24px rgba(0,0,0,0.5);
    }
    .modal-card-gem-fallback {
      width:140px; height:238px;
      border-radius:10px;
      border:2px solid rgba(201,168,76,0.5);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      font-size:4rem;
      background:var(--bg-card);
      display:none;
    }
    .modal-content { flex:1; min-width:0; }
    .modal-card-number { font-size:0.7rem; color:var(--gold); letter-spacing:0.2em; margin-bottom:4px; }
    .modal-card-name {
      font-family:'Cinzel Decorative',serif;
      font-size:1.3rem;
      color:var(--gold-light);
      margin-bottom:2px;
    }
    .modal-card-cn {
      font-family:'Noto Serif SC',serif;
      font-size:1rem;
      color:var(--text-main);
      margin-bottom:12px;
    }
    .modal-position {
      font-size:0.75rem;
      background:rgba(201,168,76,0.1);
      border:1px solid rgba(201,168,76,0.25);
      border-radius:20px;
      padding:4px 14px;
      display:inline-block;
      color:var(--gold);
      margin-bottom:12px;
      font-family:'Noto Serif SC',serif;
    }
    .modal-gem-row {
      display:flex; align-items:center; gap:10px;
      margin-bottom:16px;
    }
    .gem-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(201,168,76,0.08);
      border:1px solid rgba(201,168,76,0.25);
      border-radius:20px;
      padding:5px 14px;
      font-size:0.78rem;
      font-family:'Noto Serif SC',serif;
      color:var(--gold-light);
    }
    .modal-divider { height:1px; background:linear-gradient(90deg,var(--gold),transparent); margin:14px 0; }
    .meaning-section h3 {
      font-size:0.72rem;
      letter-spacing:0.2em;
      color:var(--gold);
      margin-bottom:8px;
      text-transform:uppercase;
    }
    .meaning-section p {
      font-size:0.88rem;
      line-height:1.8;
      color:var(--text-main);
      font-family:'Noto Serif SC',serif;
      margin-bottom:16px;
    }
    .keywords {
      display:flex; flex-wrap:wrap; gap:6px;
      margin-bottom:16px;
    }
    .kw-tag {
      background:rgba(201,168,76,0.08);
      border:1px solid rgba(201,168,76,0.2);
      border-radius:20px;
      padding:3px 12px;
      font-size:0.72rem;
      color:var(--text-sub);
      font-family:'Noto Serif SC',serif;
    }
    .reversed-tag { background:rgba(180,30,30,0.12); border-color:rgba(200,60,60,0.3); color:#E08080; }

    /* ─── Footer ─────────────────────────────────────────────────── */
    footer {
      text-align:center;
      padding:40px 0 20px;
      color:var(--text-sub);
      font-size:0.72rem;
      letter-spacing:0.1em;
      font-family:'Noto Serif SC',serif;
      position:relative; z-index:1;
    }

    /* ─── Responsive ──────────────────────────────────────────────── */
    @media (max-width:600px) {
      :root { --card-w:130px; --card-h:221px; }
      #cardsArea.celtic {
        grid-template-columns:repeat(5,var(--card-w));
        overflow-x:auto;
      }
      .modal-inner { flex-direction:column; align-items:center; }
    }
  </style>
</head>
<body>

<div id="stars"></div>

<div class="container">
  <!-- Header -->
  <header>
    <span class="logo-gem">💎</span>
    <h1>珠宝塔罗</h1>
    <p class="subtitle">Jewelry Tarot · 以宝石之光，观命运之道</p>
    <div class="divider"></div>
    <p class="intro">
      每一张塔罗牌，都与一块珍贵的宝石相对应。<br/>
      选择你的牌阵，静心冥想你的问题，<br/>
      让珠宝的灵性为你揭示命运的密语。
    </p>
  </header>

  <!-- Spread Selector -->
  <section class="spread-section">
    <h2>选择牌阵 · Choose Your Spread</h2>
    <div class="spread-options">
      <button class="spread-btn active" data-spread="ring">
        <span class="icon">💍</span>
        <span class="label">戒指占卜</span>
        <span class="desc">单张牌 · 当下洞察</span>
      </button>
      <button class="spread-btn" data-spread="necklace">
        <span class="icon">📿</span>
        <span class="label">项链占卜</span>
        <span class="desc">三张牌 · 过去现在未来</span>
      </button>
      <button class="spread-btn" data-spread="crown">
        <span class="icon">👑</span>
        <span class="label">王冠占卜</span>
        <span class="desc">凯尔特十字 · 全局解读</span>
      </button>
    </div>
  </section>

  <!-- Intent -->
  <div class="intent-wrap">
    <input type="text" id="intentInput" placeholder="✦ 在心中默想你的问题（可选）" maxlength="80" />
  </div>

  <!-- Draw -->
  <div class="draw-section">
    <button id="drawBtn">✦ 抽取塔罗 ✦</button>
    <button id="resetBtn">重新占卜</button>
  </div>

  <!-- Spread position info -->
  <div id="spreadInfo"></div>

  <!-- Cards Area -->
  <div id="cardsArea"></div>

  <!-- Hint -->
  <div id="hint">点击牌面查看详细解读 · Click a card to reveal its wisdom</div>
</div>

<!-- Modal -->
<div id="modal">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-box" id="modalBox">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>

    reversedMeaning:'终点近在眼前，却感觉仍差临门一脚。也许你在寻找捷径，或者某些重要的事项尚未完成。放慢脚步，用心完成每一个收尾的细节——真正的圆满来自完整的过程。'

/* ═══════════════════════════════════════════════════════════════
   SPREAD DEFINITIONS
═══════════════════════════════════════════════════════════════ */
const SPREADS = {
  ring: {
    label: '戒指占卜 · 单张牌',
    count: 1,
    positions: ['当下洞察']
  },
  necklace: {
    label: '项链占卜 · 三张牌',
    count: 3,
    positions: ['过去', '现在', '未来']
  },
  crown: {
    label: '王冠占卜 · 凯尔特十字',
    count: 10,
    positions: [
      '现状（核心）',
      '挑战（交叉）',
      '意识层面（高处）',
      '基础（远古过去）',
      '近期过去',
      '近期未来',
      '内在态度',
      '外部影响',
      '希望与恐惧',
      '最终结果'
    ]
  }
};

/* ═══════════════════════════════════════════════════════════════
   APP STATE & LOGIC
═══════════════════════════════════════════════════════════════ */
let currentSpread = 'ring';
let drawnCards = [];
let drawn = false;

// Fisher-Yates shuffle — true random
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawCards(count) {
  const shuffled = shuffle(CARDS);
  return shuffled.slice(0, count).map(card => ({
    ...card,
    reversed: Math.random() < 0.35  // ~35% chance reversed
  }));
}

/* ═══════════════════════════════════════════════════════════════
   RENDER CARDS
═══════════════════════════════════════════════════════════════ */
function renderCards() {
  const area = document.getElementById('cardsArea');
  const spread = SPREADS[currentSpread];
  area.innerHTML = '';
  area.className = currentSpread === 'crown' ? 'celtic' : '';

  drawnCards.forEach((card, i) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot' + (card.reversed ? ' reversed' : '');
    slot.style.animationDelay = `${i * 0.12}s`;

    slot.innerHTML = `
      <div class="card-inner">
        <div class="card-back">
          <div class="card-back-pattern"></div>
        </div>
        <div class="card-face" style="--gem-bg:${card.gemColor}22">
          <div class="card-img-wrap">
            <img
              src="${card.image}"
              alt="${card.nameCN}"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            />
            <div class="gem-fallback" style="--gem-bg:${card.gemColor}33">
              <span style="font-size:3.5rem">${card.gemEmoji}</span>
              <span style="font-size:0.7rem;color:var(--text-sub);margin-top:6px;font-family:'Noto Serif SC',serif">${card.gem}</span>
            </div>
          </div>
          <div class="card-info">
            <div class="card-number">${card.number}</div>
            <div class="card-name-cn">${card.nameCN}</div>
            <div class="card-gem">${card.gemEmoji} ${card.gem}</div>
          </div>
          <div class="reversed-badge">逆位</div>
        </div>
      </div>
      <div class="position-label">${spread.positions[i] || ''}</div>
    `;

    // Auto-flip after delay
    setTimeout(() => {
      slot.classList.add(card.reversed ? 'reversed' : 'flipped');
    }, 300 + i * 180);

    slot.addEventListener('click', () => openModal(card, i));
    area.appendChild(slot);
  });

  // Show hint
  document.getElementById('hint').style.display = 'block';
  document.getElementById('spreadInfo').style.display = 'block';

  // Show reset button
  document.getElementById('resetBtn').style.display = 'inline-block';
  document.getElementById('drawBtn').disabled = true;
}

/* ═══════════════════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════════════════ */
function openModal(card, posIndex) {
  const spread = SPREADS[currentSpread];
  const isReversed = card.reversed;
  const position = spread.positions[posIndex] || '';

  const keywords = isReversed ? card.reversedKW : card.uprightKW;
  const meaning = isReversed ? card.reversedMeaning : card.uprightMeaning;
  const otherKw = isReversed ? card.uprightKW : card.reversedKW;

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-inner">
      <div>
        <img
          class="modal-card-img"
          src="${card.image}"
          alt="${card.nameCN}"
          style="${isReversed ? 'transform:rotate(180deg)' : ''}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        />
        <div class="modal-card-gem-fallback">
          <span style="font-size:5rem">${card.gemEmoji}</span>
        </div>
      </div>
      <div class="modal-content">
        <div class="modal-card-number">${card.number} · ${card.name}</div>
        <div class="modal-card-name">${card.nameCN}</div>
        ${isReversed ? '<div style="color:#E08080;font-size:0.78rem;margin-bottom:8px;font-family:\'Noto Serif SC\',serif">逆位 · Reversed</div>' : ''}
        ${position ? `<div class="modal-position">📍 ${position}</div>` : ''}
        <div class="modal-gem-row">
          <span class="gem-badge">${card.gemEmoji} ${card.gem} · ${card.gemEN}</span>
          <span style="font-size:0.75rem;color:var(--text-sub);font-family:'Noto Serif SC',serif">${card.element} · ${card.planet}</span>
        </div>
        <div class="modal-divider"></div>
        <div class="meaning-section">
          <h3>${isReversed ? '逆位牌义' : '正位牌义'}</h3>
          <div class="keywords">
            ${keywords.map(k => `<span class="kw-tag${isReversed?' reversed-tag':''}">${k}</span>`).join('')}
          </div>
          <p>${meaning}</p>
        </div>
        <div class="meaning-section">
          <h3>${isReversed ? '正位关键词参考' : '逆位关键词参考'}</h3>
          <div class="keywords">
            ${otherKw.map(k => `<span class="kw-tag" style="opacity:0.5">${k}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

/* ═══════════════════════════════════════════════════════════════
   EVENT LISTENERS
═══════════════════════════════════════════════════════════════ */
// Spread buttons
document.querySelectorAll('.spread-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (drawn) return;
    document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSpread = btn.dataset.spread;
  });
});

// Draw button
document.getElementById('drawBtn').addEventListener('click', () => {
  if (drawn) return;
  drawn = true;
  const count = SPREADS[currentSpread].count;
  drawnCards = drawCards(count);
  renderCards();
});

// Reset button
document.getElementById('resetBtn').addEventListener('click', () => {
  drawn = false;
  drawnCards = [];
  document.getElementById('cardsArea').innerHTML = '';
  document.getElementById('cardsArea').className = '';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('spreadInfo').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('drawBtn').disabled = false;
  document.getElementById('intentInput').value = '';
  document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-spread="ring"]').classList.add('active');
  currentSpread = 'ring';
});

// Modal close
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
